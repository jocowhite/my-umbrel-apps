version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: my-store-tiny-status_server_1
      APP_PORT: 8080

  server:
    image: python:3.13-alpine
    init: true
    user: "1000:1000"
    command:
      - python
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer
        from datetime import datetime, timezone
        import html

        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')
                body = f'''<!doctype html>
        <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Tiny Status</title>
          <style>
            body {{ margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #111827; color: #f9fafb; }}
            main {{ max-width: 680px; padding: 2rem; }}
            .card {{ background: #1f2937; border: 1px solid #374151; border-radius: 24px; padding: 2rem; box-shadow: 0 24px 80px rgba(0,0,0,.35); }}
            h1 {{ margin-top: 0; font-size: clamp(2rem, 6vw, 4rem); }}
            code {{ background: #030712; padding: .2rem .4rem; border-radius: .4rem; }}
            .ok {{ color: #86efac; font-weight: 700; }}
          </style>
        </head>
        <body>
          <main class="card">
            <p class="ok">✓ Umbrel custom app is running</p>
            <h1>Tiny Status</h1>
            <p><strong>Server time:</strong> {now}</p>
            <p><strong>Request path:</strong> <code>{html.escape(self.path)}</code></p>
            <p>This minimal app is a smoke test for building custom Umbrel apps from this repo.</p>
          </main>
        </body>
        </html>'''.encode()
                self.send_response(200)
                self.send_header('Content-Type', 'text/html; charset=utf-8')
                self.send_header('Content-Length', str(len(body)))
                self.end_headers()
                self.wfile.write(body)

        HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
