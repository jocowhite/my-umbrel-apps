manifestVersion: 1.1
id: my-store-tiny-status
name: Tiny Status
tagline: A tiny test app that shows server time and request info
icon: https://raw.githubusercontent.com/jocowhite/my-umbrel-apps/master/my-store-tiny-status/icon.svg
category: development
version: "1.0.0"
port: 8477
description: >-
  Tiny Status is a minimal Umbrel test app. It runs a small Python web server
  that displays the current server time, request path, and a short confirmation
  that this custom community app store can ship working apps.


  This app is intentionally simple and useful as a packaging smoke test before
  building more serious Umbrel apps.
developer: jocowhite
website: https://github.com/jocowhite/my-umbrel-apps
submitter: jocowhite
submission: https://github.com/jocowhite/my-umbrel-apps
repo: https://github.com/jocowhite/my-umbrel-apps
support: https://github.com/jocowhite/my-umbrel-apps/issues
gallery:
  - https://raw.githubusercontent.com/jocowhite/my-umbrel-apps/master/my-store-tiny-status/gallery.svg
releaseNotes: "Initial test app."
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
