description: >-
  MoneyMap ist ein privater Personal Finance Manager fuer dein Umbrel.
  Importiere CSV-Dateien von Sparkasse, N26 und PayPal, ohne deine Finanzdaten
  an einen Cloud-Dienst oder ein Sprachmodell zu senden.


  Regelbasierte Kategorien mit Keywords und RegEx lassen sich direkt aus
  Buchungstexten erstellen. MoneyMap unterscheidet Fixkosten, variable Kosten
  und Einnahmen, erkennt doppelte Importe und gleicht interne Transfers zwischen
  deinen eigenen Konten automatisch ab.


  Dashboards zeigen Monatssaldo, Kostenstruktur, Kategorien und den Verlauf
  deiner Einnahmen und Ausgaben. Alle Daten liegen lokal in einer SQLite-Datei
  im verwalteten Umbrel App-Datenverzeichnis.
