manifestVersion: 1.1
id: my-store-triathlon-hq
name: Health Dashboard
tagline: Garmin health, sleep, recovery, and body composition dashboard
icon: https://raw.githubusercontent.com/jocowhite/my-umbrel-apps/master/my-store-triathlon-hq/icon.png
category: health
version: "0.3.0"
port: 8477
description: >-
  Health Dashboard is a personal Garmin health dashboard with a soft glass interface inspired by Vita.
  It shows readiness, sleep, HRV, resting heart rate, steps, active minutes, and Garmin Index Scale body composition.


  It connects to your existing Garmin-to-InfluxDB data on Umbrel and turns daily stats, sleep, HRV,
  body battery, training load, and body composition into a compact health view.


  The app also exposes /api/summary so OpenClaw or other local tools can connect to the dashboard later.
developer: jocowhite
website: https://github.com/jocowhite/my-umbrel-apps
submitter: jocowhite
submission: https://github.com/jocowhite/my-umbrel-apps
repo: https://github.com/jocowhite/my-umbrel-apps
support: https://github.com/jocowhite/my-umbrel-apps/issues
gallery:
  - https://raw.githubusercontent.com/jocowhite/my-umbrel-apps/master/my-store-triathlon-hq/gallery.png
releaseNotes: "Rebuild the Triathlon HQ interface as a Vita-style Health Dashboard and add Garmin Index Scale body composition metrics."
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
