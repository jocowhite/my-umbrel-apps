version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: my-store-triathlon-hq_server_1
      APP_PORT: 8080

  server:
    image: python:3.13-alpine
    init: true
    restart: on-failure
    command: ["python", "/app/server.py"]
    environment:
      PORT: "8080"
      RACE_NAME: "Challenge Kaiserwinkl-Walchsee"
      RACE_DATE: "2026-06-28"
      RACE_DISTANCE: "1.9 km swim · 90 km bike · 21.1 km run"
      BIKE_ELEVATION: "1100 m climbing"
      INFLUXDB_URL: "http://influxdb_influxdb_1:8086"
      INFLUXDB_DATABASE: "GarminStats"
      INFLUXDB_USERNAME: "openclaw"
      INFLUXDB_PASSWORD: "openclaw"
    volumes:
      - ./app:/app:ro
    networks:
      - default
      - umbrel_main_network

networks:
  umbrel_main_network:
    external: true
